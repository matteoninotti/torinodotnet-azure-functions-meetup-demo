# Deploy di un worker su Azure Functions Flex Consumption.
#
# Parte SOLO a mano (workflow_dispatch), mai su push: un deploy involontario
# nel mezzo di un run di misura resetta le istanze e invalida la misura.
#
# Autenticazione OIDC federata: nessun secret con credenziali nel repo, solo
# gli identificativi (client/tenant/subscription) come variables.

name: Deploy worker

on:
  workflow_dispatch:
    inputs:
      language:
        description: Worker da deployare
        required: true
        default: python
        type: choice
        options:
          - python
          - dotnet
          - go

permissions:
  id-token: write # necessario per OIDC
  contents: read # necessario per checkout

env:
  RESOURCE_GROUP: rg-torinodotnet-demo
  IMAGES_CONTAINER: test-images

# Due deploy sovrapposti sullo stesso worker si contendono l'unico
# released-package.zip del container (D78): il secondo sovrascrive il pacchetto
# mentre il primo sta ancora sincronizzando i trigger. Il gruppo e' per
# linguaggio, non globale, perche' i tre worker hanno container separati e
# deployarli in parallelo e' legittimo.
#
# cancel-in-progress FALSE e non true: un deploy interrotto a meta' lascia l'app
# in uno stato che nessuno ha verificato. Meglio aspettare.
concurrency:
  group: deploy-${{ inputs.language }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Il vincolo "solo da main" vive QUI e non solo nello step sotto. Un
    # workflow_dispatch esegue il workflow del ref scelto ([events that trigger
    # workflows](https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows):
    # "each workflow run will use the version of the workflow that is present in
    # the associated commit SHA or Git ref of the event"), quindi un guard
    # scritto nel file non esiste sui branch che non lo contengono — cioe'
    # proprio quelli da fermare. La deployment branch policy dell'environment e'
    # configurazione del repository: il contenuto del ref non la tocca, e
    # GitHub la applica prima che il job parta.
    environment: production
    steps:
      # Con `environment: production` sul job, il subject del token OIDC e'
      # `...:environment:production` e non contiene piu' il branch: la
      # credenziale federata registrata per questo job e' su quel subject, e
      # il vincolo "solo da main" lo applica la deployment branch policy
      # dell'environment, non Entra. Un branch che non referenzia l'environment
      # presenta invece `...:ref:refs/heads/<branch>` e il login fallisce con
      # AADSTS700213 (D44), che e' l'errore sbagliato da leggere: dice
      # "credenziale non trovata" e manda a cercare un problema di
      # configurazione che non c'e'. Qui il motivo vero e' scritto, e prima che
      # la pipeline tocchi qualcosa.
      - name: Il deploy parte solo da main (D44)
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Questo workflow e' stato lanciato da ${{ github.ref }}. Il deploy parte solo da refs/heads/main: la credenziale federata OIDC e' registrata su quel subject e su nessun altro (D44). Per deployare il codice di una fase, prima si porta su main."
          exit 1

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Login su Azure (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Le immagini di test non stanno nel repo. Arrivano da un container
      # privato dello stesso storage account: la pipeline e' gia' autenticata
      # su Azure, quindi non serve nessun secret in piu' (D40).
      #
      # L'account si ricava dall'app che si sta deployando, che sa gia' da quale
      # account prende il pacchetto: e' deterministico a prescindere da quanti
      # account ci siano nel gruppo, e non aggiunge nessun nome cablato oltre a
      # quello dell'app. `sed -n ... p` e non un `sed` normale: un valore che
      # non e' un URL di blob deve dare una stringa vuota, non passare
      # invariato, altrimenti il `test -n` non ferma niente.
      - name: Scarica le immagini di test
        run: |
          STORAGE=$(az resource show \
            --resource-group "$RESOURCE_GROUP" \
            --name "torinodotnet-${{ inputs.language }}" \
            --resource-type Microsoft.Web/sites --api-version 2024-04-01 \
            --query "properties.functionAppConfig.deployment.storage.value" -o tsv \
            | sed -nE 's#^https://([a-z0-9]{3,24})\.blob\.core\.windows\.net/.*#\1#p')
          test -n "$STORAGE" || {
            echo "impossibile ricavare lo storage account di torinodotnet-${{ inputs.language }}" >&2
            exit 1
          }
          az storage blob download-batch \
            --account-name "$STORAGE" \
            --source "$IMAGES_CONTAINER" \
            --destination functions/images \
            --auth-mode key \
            --no-progress -o none

      # Porta le immagini dentro il pacchetto del worker. Fallisce apposta se
      # la sorgente e' vuota o se un file non e' un JPEG vero (D36): meglio
      # rompere qui che deployare un'app che risponde 404 su tutto.
      - name: Sincronizza le immagini nel worker
        run: ./scripts/sync-images.sh ${{ inputs.language }}

      # --- Python: test in CI prima del deploy ------------------------------
      # Stesso cancello di .NET e Go (D73): i test leggono i casi di conformita'
      # condivisi, quindi un worker che divergesse dagli altri due — sulla
      # geometria dell'output, sul parsing dei parametri o sui parametri
      # dell'encoder — non arriva in produzione. Python era l'unico dei tre a
      # deployarsi senza, ed e' il linguaggio da cui i casi condivisi sono nati.
      # Sta DOPO sync-images.sh di proposito: senza le immagini i test della
      # pipeline falliscono (D107), e fallirebbero per un motivo che non e' il
      # codice. Prima di D107 si auto-saltavano, e allora l'ordine serviva a
      # evitare una suite verde che non aveva verificato niente: il motivo e'
      # cambiato, l'ordine no.
      - name: Installa Python
        if: inputs.language == 'python'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          # La stessa 3.12 dichiarata nel Bicep per la function app: Pillow non
          # e' la stessa build su due minori diverse di Python.
          python-version: "3.12"

      - name: Test del worker Python
        if: inputs.language == 'python'
        run: |
          python -m pip install --upgrade pip
          pip install -r functions/python/requirements-dev.txt
          pytest functions/python -q

      # --- .NET: build in CI, non da remoto ---------------------------------
      # Oryx compilerebbe dal sorgente, e il flag ReadyToRun di D11/D24 vive
      # sul comando di publish: da remoto non avrebbe dove stare. Le immagini
      # entrano nell'output di publish grazie all'ItemGroup del .csproj, non
      # perche' sono nella cartella del progetto.
      - name: Installa .NET
        if: inputs.language == 'dotnet'
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: "10.0.x"

      - name: Test del worker .NET
        if: inputs.language == 'dotnet'
        run: dotnet test functions/dotnet-tests/ResizeWorker.Tests.csproj -c Release --nologo

      # ReadyToRun sta QUI e non nel .csproj di proposito (D11, D24): e' la
      # scelta idiomatica per cio' che si mette in produzione, ma il .csproj
      # resta pulito e `func start` in locale continua a funzionare com'era.
      # Richiede un publish RID-specific; --self-contained false tiene il
      # pacchetto framework-dependent, perche' il runtime ce lo mette Flex.
      # ⚠️ R2R raddoppia il pacchetto (5,9 -> 12,1 MB) e Flex lo scarica a
      # ogni cold start: che il saldo sia positivo va MISURATO in Fase 7, non
      # assunto.
      - name: Publish del worker .NET
        if: inputs.language == 'dotnet'
        run: |
          dotnet publish functions/dotnet/ResizeWorker.csproj \
            -c Release -r linux-x64 --self-contained false \
            -p:PublishReadyToRun=true \
            -o "${{ runner.temp }}/publish" --nologo
          test -n "$(find "${{ runner.temp }}/publish/images" -maxdepth 1 -type f 2>/dev/null)" || {
            echo "Nessuna immagine nell'output di publish: l'app partirebbe rispondendo 404 su tutto." >&2
            exit 1
          }

      # --- Go: binario statico costruito in CI ------------------------------
      # Oryx non supporta Go, quindi il binario si compila qui. Il pacchetto si
      # assembla a mano e NON con `func pack`: quel comando produce uno zip con
      # dentro solo `app` e `host.json` — le immagini non ci entrano, e l'app
      # partirebbe rispondendo 404 su tutto (D35, D86).
      - name: Installa Go
        if: inputs.language == 'go'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          # Versione esatta e non "1.27": la stdlib viaggia col compilatore, e
          # `image/jpeg` E' la libreria che stiamo misurando.
          go-version: "1.27.1"
          cache-dependency-path: functions/go/go.sum

      - name: Test del worker Go
        if: inputs.language == 'go'
        working-directory: functions/go
        run: go test ./...

      - name: Build del worker Go
        if: inputs.language == 'go'
        run: |
          PKG="${{ runner.temp }}/go-package"
          mkdir -p "$PKG/images"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -C functions/go -o "$PKG/app" .
          cp functions/go/host.json "$PKG/"
          # `find` e non un glob `*.jpg`: sync-images.sh accetta qualunque
          # file coi byte magici di un JPEG a prescindere dall'estensione, e
          # resize_core.go carica sia .jpg sia .jpeg (case-insensitive). Un
          # glob su una sola estensione lascerebbe fuori in silenzio un file
          # .jpeg valido, rompendo la parita' con Python e .NET (che
          # impacchettano images/** per intero) senza che il deploy fallisca.
          find functions/go/images -maxdepth 1 -type f \( -iname '*.jpg' -o -iname '*.jpeg' \) \
            -exec cp {} "$PKG/images/" \;
          test -n "$(find "$PKG/images" -maxdepth 1 -type f)" || {
            echo "Nessuna immagine nel pacchetto Go: l'app partirebbe rispondendo 404 su tutto." >&2
            exit 1
          }
          ls -la "$PKG" "$PKG/images"

      - name: Ricava il nome della function app e il pacchetto
        id: app
        run: |
          echo "name=torinodotnet-${{ inputs.language }}" >> "$GITHUB_OUTPUT"
          case "${{ inputs.language }}" in
            dotnet)
              echo "package=${{ runner.temp }}/publish" >> "$GITHUB_OUTPUT"
              echo "remote_build=false" >> "$GITHUB_OUTPUT"
              ;;
            go)
              echo "package=${{ runner.temp }}/go-package" >> "$GITHUB_OUTPUT"
              echo "remote_build=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "package=functions/${{ inputs.language }}" >> "$GITHUB_OUTPUT"
              echo "remote_build=true" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Deploy
        uses: Azure/functions-action@c5060b3b8bb1ebbcb531abd00c822ecbaa8ea656 # v1.5.7
        with:
          app-name: ${{ steps.app.outputs.name }}
          package: ${{ steps.app.outputs.package }}
          # Su Flex il build remoto e' sempre Oryx: non vanno impostati
          # scm-do-build-during-deployment ne' enable-oryx-build. Per .NET e'
          # spento: si deploya un artefatto gia' costruito.
          remote-build: ${{ steps.app.outputs.remote_build }}

      # Una copia dimenticata non fa fallire il deploy: l'app parte lo stesso
      # e risponde 404 su tutto. Qui si guarda invece di sperare (D35).
      - name: Verifica che l'app veda le immagini
        run: |
          URL="https://${{ steps.app.outputs.name }}.azurewebsites.net/api/images"
          for tentativo in 1 2 3 4 5; do
            RISPOSTA=$(curl -sS --max-time 60 "$URL" || true)
            CONTEGGIO=$(echo "$RISPOSTA" | python3 -c \
              "import sys,json; print(len(json.load(sys.stdin).get('images',[])))" 2>/dev/null || echo 0)
            if [ "$CONTEGGIO" -gt 0 ]; then
              echo "$CONTEGGIO immagini disponibili"
              echo "$RISPOSTA"
              exit 0
            fi
            echo "tentativo $tentativo: nessuna immagine ancora, il cold start puo' volerci un po'"
            sleep 15
          done
          echo "L'app risponde ma non vede nessuna immagine: il pacchetto e' arrivato incompleto." >&2
          exit 1
